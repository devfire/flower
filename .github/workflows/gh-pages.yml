name: Deploy Flower to GitHub Pages

on:
  push:
    branches: [main]
  # Weekly rebuild so a new NSDA PF topic period lands without a code
  # push (issue #13): the fetch step below re-extracts topics.json.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Deploy only ships code that passed the same checks PRs face (issue #11).
  quality:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Same pinned toolchain and Trunk as ci.yml, so the weekly scheduled
      # deploy cannot pick up a new compiler or Trunk unreviewed (issue #38).
      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + trunk
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      # Build-time NSDA extraction (issue #13): a browser fetch is
      # CORS-blocked, so curl the topics page here instead. On failure
      # the script keeps the committed topics.json and logs ::error::.
      # Scheduled runs pass --strict so a fallback fails the job (red)
      # instead of silently deploying a stale topic; push deploys keep
      # the fallback and succeed.
      - name: Fetch current NSDA PF topic into topics.json
        env:
          FETCH_ARGS: ${{ github.event_name == 'schedule' && '--strict' || '' }}
        run: python3 scripts/fetch_nsda_topic.py --output topics.json $FETCH_ARGS

      - name: Build (relative public URL works for project pages, user pages, and custom domains)
        run: trunk build --release --public-url ./

      # SPA fallback: no router exists, so unknown paths serve the app
      # shell. Only this copy is rewritten to root-absolute asset URLs:
      # the main build keeps `--public-url ./` for portability, but `./`
      # resolves against the requested path, so a fallback served at
      # /some/deep/path would 404 its own JS/wasm/CSS and show blank.
      # Root-absolute assumes serving at the origin root, which holds
      # for production via the custom domain below
      # (flower.devfire.io); on a project subpath the fallback copy
      # would not load, while index.html keeps working.
      - name: SPA fallback for Pages
        run: |
          cp dist/index.html dist/404.html
          sed -i 's#\./#/#g' dist/404.html
          if grep -q '\./' dist/404.html; then
            echo "::error::404.html still contains relative asset URLs" >&2
            exit 1
          fi

      # Custom domain (flower.devfire.io -> devfire.github.io CNAME in Route 53).
      # Without this in the artifact, deploys would drop the Pages custom domain.
      - name: Custom domain
        run: echo "flower.devfire.io" > dist/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
