name: Deploy Flower to GitHub Pages

on:
  push:
    branches: [main]
  # Weekly rebuild so a new NSDA PF topic period lands without a code
  # push (issue #13): the fetch step below re-extracts topics.json.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Deploy only ships code that passed the same checks PRs face (issue #11).
  quality:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + trunk
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: taiki-e/install-action@trunk

      # Build-time NSDA extraction (issue #13): a browser fetch is
      # CORS-blocked, so curl the topics page here instead. On failure
      # the script keeps the committed topics.json and logs ::error::.
      - name: Fetch current NSDA PF topic into topics.json
        run: python3 scripts/fetch_nsda_topic.py --output topics.json

      - name: Build (relative public URL works for project pages, user pages, and custom domains)
        run: trunk build --release --public-url ./

      - name: SPA fallback for Pages
        run: cp dist/index.html dist/404.html

      # Custom domain (flower.devfire.io -> devfire.github.io CNAME in Route 53).
      # Without this in the artifact, deploys would drop the Pages custom domain.
      - name: Custom domain
        run: echo "flower.devfire.io" > dist/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
