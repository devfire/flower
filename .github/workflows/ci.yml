name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32 target, rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (wasm target)
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test

      - name: NSDA topic extraction tests
        run: python3 -m unittest discover -s scripts -v

      - name: Install Trunk
        uses: taiki-e/install-action@trunk

      - name: Build (release, same flags as deploy)
        run: trunk build --release --public-url ./
