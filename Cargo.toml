[package]
name = "flower"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
gloo-timers = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "Navigator",
    "Clipboard",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
# indexing_slicing intentionally off: all indices are clamped steps, enumerated
# speech columns, or cells built with exactly SPEECH_COLS.len() entries (model.rs).
